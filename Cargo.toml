[package]
name = "deectx"
version = "0.1.0"
description = "Local-first PII-masking reverse proxy for AI coding tools"
license = "Apache-2.0"
repository = "https://github.com/deectxone/deectx"
edition = "2021"

[features]
default = []
ner = ["dep:ort", "dep:ndarray", "dep:tokenizers"]

[dependencies]
anyhow = "1"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
ort = { version = "2.0.0-rc.13", optional = true, features = ["load-dynamic", "ndarray"] }
ndarray = { version = "0.17", optional = true }
tokenizers = { version = "0.20", optional = true }

[[bin]]
name = "ner_spike"
path = "src/bin/ner_spike.rs"
required-features = ["ner"]
