name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Keyless Sigstore signing + SLSA/SBOM attestations use short-lived OIDC
  # tokens — no long-lived signing key to manage or leak.
  id-token: write
  attestations: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: deectx-x86_64-unknown-linux-gnu.tar.gz
          # Intel macOS is cross-compiled on the arm64 runner (macos-14): the
          # Intel-only macos-13 runners are being retired and can queue for
          # hours. Rust cross-compiles x86_64-apple-darwin on Apple silicon
          # with no linker drama once the target is installed.
          - os: macos-14
            target: x86_64-apple-darwin
            artifact: deectx-x86_64-apple-darwin.tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: deectx-aarch64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: deectx-x86_64-pc-windows-msvc.zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/deectx${{ runner.os == 'Windows' && '.exe' || '' }}"
          ART="${{ matrix.artifact }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path '$BIN' -DestinationPath '$ART'"
          else
            tar -C "$(dirname "$BIN")" -czf "$ART" "$(basename "$BIN")"
          fi
          echo "artifact=$ART" >> "$GITHUB_ENV"
          echo "sha256=$(shasum -a 256 "$ART" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Print SHA-256
        run: echo "${{ matrix.artifact }} -> ${{ env.sha256 }}"

      # --- Supply-chain: sign + attest each binary before it's uploaded ---
      # SLSA build provenance: cryptographically ties this artifact to this
      # commit + workflow run, verifiable with `gh attestation verify`.
      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.artifact }}

      # Detached Sigstore signature so users off GitHub can verify with cosign.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign archive (keyless)
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle "${{ matrix.artifact }}.cosign.bundle" \
            "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Upload signature bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}.cosign.bundle
          path: ${{ matrix.artifact }}.cosign.bundle

  publish-crate:
    name: Publish to crates.io
    # Deliberately NOT `needs: build` — cargo publish runs its own verification
    # build on Linux and does not need the release artifacts. Decoupling means a
    # slow/unavailable macOS runner can never block the crates.io publish.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # Publishing needs the maintainer's crates.io API token. Add it once
          # as the CARGO_REGISTRY_TOKEN repo secret; until then this step is a
          # graceful no-op so releases still succeed.
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN not set; skipping crates.io publish."
            echo "Add it at Settings → Secrets and variables → Actions."
            exit 0
          fi
          # Idempotent: skip if this version is already on crates.io so a
          # re-run of the tag doesn't fail the workflow.
          VER=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if curl -fsS "https://crates.io/api/v1/crates/deectx/$VER" >/dev/null 2>&1; then
            echo "deectx $VER already published; skipping."
            exit 0
          fi
          cargo publish

  release:
    name: Attach to GitHub Release + refresh manifests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      # CycloneDX SBOM from the source tree (Cargo.lock) — one bill of
      # materials for the release, attached for downstream vuln review.
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: deectx-sbom.cyclonedx.json

      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-path: ./dist/deectx-x86_64-unknown-linux-gnu.tar.gz
          sbom-path: deectx-sbom.cyclonedx.json

      - name: Stage SBOM for release upload
        run: cp deectx-sbom.cyclonedx.json ./dist/deectx-sbom.cyclonedx.json

      - name: Upload binaries + signatures + SBOM to release ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Create the GitHub Release for this tag on first run, then upload into
          # it. `gh release upload` errors if the release doesn't exist yet, so
          # this keeps the flow fully automated (no manual `gh release create`).
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes "Automated release ${{ github.ref_name }}." \
              --verify-tag
          fi
          gh release upload "${{ github.ref_name }}" ./dist/* --clobber

      - name: Refresh Homebrew and Scoop manifests
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION

          # Homebrew installs the prebuilt per-target release archives (no Rust
          # toolchain / linker). Bump the formula version and refresh each
          # arch's sha256 from the built artifacts. Idempotent across releases.
          python - <<'EOF'
          import hashlib, os, pathlib, re
          version = os.environ["VERSION"]
          formula = pathlib.Path("install/brew/deectx.rb")
          text = formula.read_text()
          text = re.sub(r'version "[^"]*"', f'version "{version}"', text, count=1)
          targets = {
              "aarch64-apple-darwin":     "dist/deectx-aarch64-apple-darwin.tar.gz",
              "x86_64-apple-darwin":      "dist/deectx-x86_64-apple-darwin.tar.gz",
              "x86_64-unknown-linux-gnu": "dist/deectx-x86_64-unknown-linux-gnu.tar.gz",
          }
          for target, art in targets.items():
              digest = hashlib.sha256(pathlib.Path(art).read_bytes()).hexdigest()
              text = re.sub(
                  r'(deectx-' + re.escape(target) + r'\.tar\.gz"\s*\n\s*sha256 ")[0-9a-f]*(")',
                  lambda m, d=digest: m.group(1) + d + m.group(2),
                  text,
              )
          formula.write_text(text)
          EOF

          # Scoop uses the Windows zip; bump version + url and recompute its hash.
          WIN_SHA=$(shasum -a 256 dist/deectx-x86_64-pc-windows-msvc.zip | awk '{print $1}')
          export WIN_SHA
          python - <<'EOF'
          import json, os, pathlib
          version = os.environ["VERSION"]
          p = pathlib.Path("install/scoop/deectx.json")
          m = json.loads(p.read_text())
          m["version"] = version
          arch = m["architecture"]["64bit"]
          arch["hash"] = os.environ["WIN_SHA"]
          arch["url"] = (
              "https://github.com/deectxone/deectx/releases/download/"
              f"v{version}/deectx-x86_64-pc-windows-msvc.zip"
          )
          p.write_text(json.dumps(m, indent=2) + "\n")
          EOF

      - name: Commit refresh (only on default branch)
        run: |
          set -euo pipefail
          # A tag can point at a commit on any branch. Only commit the manifest
          # refresh back when the tagged commit is reachable from the default
          # branch (i.e. master), so develop/topic tags never trigger pushes.
          DEFAULT="${{ github.event.repository.default_branch }}"
          git fetch origin "$DEFAULT"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$DEFAULT"; then
            echo "Tag is not on $DEFAULT; skipping manifest commit."
            exit 0
          fi
          git config user.name "deectx-release-bot"
          git config user.email "deectx-bot@users.noreply.github.com"
          git add install/brew/deectx.rb install/scoop/deectx.json
          if git diff --cached --quiet; then
            echo "No manifest changes."
          else
            git commit -m "release: refresh brew + scoop manifests for ${{ github.ref_name }}"
            git push origin "HEAD:$DEFAULT"
          fi

      - name: Push manifest to scoop-deectx bucket
        # The bucket lives in a separate repo (Scoop requires manifests at the
        # bucket root, not nested under install/scoop/ in the main repo) so
        # this needs a PAT with write access to deectxone/scoop-deectx —
        # GITHUB_TOKEN only covers the current repo. Skipped if the secret
        # isn't configured yet.
        env:
          BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BUCKET_TOKEN}" ]; then
            echo "SCOOP_BUCKET_TOKEN not set; skipping scoop-deectx bucket push."
            echo "See install/scoop/README.md for setup."
            exit 0
          fi
          rm -rf /tmp/scoop-deectx
          git clone "https://x-access-token:${BUCKET_TOKEN}@github.com/deectxone/scoop-deectx.git" /tmp/scoop-deectx
          mkdir -p /tmp/scoop-deectx/bucket
          cp install/scoop/deectx.json /tmp/scoop-deectx/bucket/deectx.json
          cd /tmp/scoop-deectx
          git config user.name "deectx-release-bot"
          git config user.email "deectx-bot@users.noreply.github.com"
          git add bucket/deectx.json
          if git diff --cached --quiet; then
            echo "No manifest changes for scoop-deectx."
          else
            git commit -m "release: deectx ${{ github.ref_name }}"
            git push origin HEAD:master
          fi
